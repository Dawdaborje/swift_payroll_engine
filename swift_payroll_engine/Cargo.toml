[package]
name = "swift_payroll_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["tokio", "macros"] }
clap = { version = "4.6.1", features = ["env", "derive", "string"] }
log = "0.4.32"

# modules
sp_engine.workspace = true
sp_dsl.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
rust_decimal = "1.42.1"
serde_json = "1.0.150"
cel = "0.13.0"
regex = "1.12.4"
fake = "5.1.0"
uuid = { version = "1.23.4", features = ["v4", "v5"] }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "payroll_throughput"
harness = false
