[package]
name = "swift_payroll_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line for the Swift payroll engine: a salary structure and people in, payslips out"

[dependencies]
sp_engine = { workspace = true, features = ["parallel"] }
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[dev-dependencies]
rayon = "1"
rust_decimal.workspace = true

[[example]]
name = "stress"
path = "../example_data/stress.rs"
