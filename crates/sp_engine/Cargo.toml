[package]
name = "sp_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Payroll calculation: a salary structure of components with exact decimal formulas, in dependency order"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = ["parallel", "exact-json"]
parallel = ["dep:rayon"]
# JSON numbers are read as the exact text they were written in (serde_json's `arbitrary_precision`). Without it
# a JSON number goes through an f64 first (exact up to 15 significant digits). It changes serde_json for the
# whole build it is part of, so a host that cannot have that (it breaks `#[serde(flatten)]` with numbers) turns
# default features off and passes numbers it needs exact as text it checked.
exact-json = ["serde_json/arbitrary_precision"]

[dependencies]
sp_expr.workspace = true
rust_decimal = { workspace = true, features = ["serde-str"] }
serde.workspace = true
serde_json.workspace = true
rayon = { version = "1", optional = true }
