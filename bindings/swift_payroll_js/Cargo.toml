[package]
# wasm-pack names the npm package after this crate: `swift-payroll-engine`. Never published to crates.io.
name = "swift-payroll-engine"
# Keep in step with the workspace version (this crate is outside the workspace, see the root Cargo.toml).
version = "0.3.0"
edition = "2021"
description = "JavaScript/TypeScript bindings (WebAssembly) for the Swift payroll engine"
license = "MIT"
repository = "https://github.com/Dawdaborje/swift_payroll_engine"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No `parallel`: WebAssembly has no threads here. exact-json is safe: this is its own build.
swift_payroll_core = { path = "../../crates/swift_payroll_core", default-features = false, features = ["exact-json"] }
serde = "1.0.200"
serde_json = "1.0.120"
wasm-bindgen = "0.2"
js-sys = "0.3"
