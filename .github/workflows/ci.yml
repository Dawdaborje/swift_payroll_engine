name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Binding versions match the workspace version
        shell: bash
        run: |
          want=$(grep -m1 '^version' Cargo.toml)
          for f in bindings/swift_payroll_py/Cargo.toml bindings/swift_payroll_js/Cargo.toml; do
            got=$(grep -m1 '^version' "$f")
            [[ "$got" == "$want" ]] || { echo "::error file=$f::$got, expected $want"; exit 1; }
          done
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test -p swift_payroll_expr --locked
      - run: cargo test -p swift_payroll_core --locked --no-default-features
      - run: cargo test -p swift_payroll_core --locked --features exact-json
      - run: cargo build -p swift_payroll_core --locked --no-default-features --target wasm32-unknown-unknown

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --workspace --locked

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Builds each .crate the way crates.io would and compiles it from the packaged files alone.
      - run: cargo package --workspace --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The bindings are outside the workspace, so their lockfiles are audited separately.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: bindings/swift_payroll_py
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: bindings/swift_payroll_js

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the mixed-result CLI demo
        shell: bash
        run: |
          set +e
          cargo run -q -- --input example_data/demo_run.json > "$RUNNER_TEMP/demo_run_output.json"
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "Expected demo CLI exit code 2 for the intentionally invalid E-003 input, got $status"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/demo_run_output.json" <<'PY'
          import json, sys
          results = json.load(open(sys.argv[1], encoding="utf-8"))
          assert len(results) == 3, f"expected three employee results, got {len(results)}"
          assert results[0]["net"] == "54800.00", results[0]
          assert results[1]["net"] == "116100.46", results[1]
          assert results[2]["error"] == "E-003: `base_salary` is missing", results[2]
          PY
      - name: Stress run against the independent oracle (small)
        run: cargo run -q --release -p swift_payroll_engine --example stress -- run --employees 2000 --rules 200 --oracle-every 1

  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "jsonschema>=4.18"
      - name: Validate examples, golden payslips and CLI output against schemas/
        shell: bash
        run: |
          cargo run -q -- --input example_data/demo_run.json --explain > "$RUNNER_TEMP/demo.json" || [[ $? -eq 2 ]]
          python3 schemas/check.py "$RUNNER_TEMP/demo.json"

  python:
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bindings/swift_payroll_py
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: pip install ".[test]"
      - run: pytest -q tests
      - if: matrix.python == '3.13'
        run: pip install "maturin>=1.8,<2" && maturin build --release --locked --out dist
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: bindings/swift_payroll_py/dist

  js:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bindings/swift_payroll_js
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: wasm-pack build --target nodejs --release -- --locked
      - run: node --test tests/
      - run: npm pack ./pkg
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: bindings/swift_payroll_js/*.tgz

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # A short run per target on every push; long campaigns are run by hand (see fuzz/README.md).
      - name: Fuzz each target for 60 seconds
        working-directory: fuzz
        run: |
          for target in expr structure rule_pack; do
            cargo fuzz run "$target" -- -max_total_time=60
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # cargo-semver-checks compares against the latest release on crates.io, so it can only run once the
      # crates have been published. Until then this job reports that and passes.
      - name: Find whether the crates are published
        id: published
        shell: bash
        run: |
          if cargo info swift_payroll_core --registry crates-io > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::swift_payroll_core is not on crates.io yet; skipping cargo-semver-checks"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.yes == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: swift_payroll_expr, swift_payroll_core

  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: 0.64.0
          args: --workspace --output-format=terse
